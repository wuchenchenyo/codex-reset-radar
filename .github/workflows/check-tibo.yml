name: Check Tibo

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call monitor cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing GitHub secrets APP_URL or CRON_SECRET."
            exit 1
          fi
          curl -fsS -X GET "${APP_URL%/}/api/cron/check-tibo" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json"
