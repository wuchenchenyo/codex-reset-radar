name: Check Tibo

on:
  schedule:
    # GitHub often skips */5 under load. Hit several times per hour instead.
    - cron: "8,18,28,38,48,58 * * * *"
    - cron: "3 * * * *"
  workflow_dispatch:

concurrency:
  group: check-tibo
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call monitor cron
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing GitHub secrets APP_URL or CRON_SECRET."
            exit 1
          fi
          curl --retry 3 --retry-delay 5 --fail-with-body -sS -X GET \
            "${APP_URL%/}/api/cron/check-tibo" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json"
